<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MOSS - AI 工作台" />
    <meta name="theme-color" content="#18181b" />
    <link rel="icon" type="image/png" href="/MOSS.png" />
    <title>MOSS</title>
    <script>
      /* 启动主题判定：localStorage 快照（moss-theme-fast）优先，无值/异常跟随系统偏好。
         须在 body 渲染前同步执行，保证 boot 骨架首帧底色正确，消除白→黑突变。 */
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('moss-theme-fast');
          var dark =
            stored === 'dark' ||
            ((stored === 'system' || !stored) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          theme = dark ? 'dark' : 'light';
        } catch (e) {
          /* localStorage 不可用（隐私模式等）：默认暗色 */
        }
        document.documentElement.dataset.bootTheme = theme;
        // 同步应用 .dark class：应用主题变量（global.css 的 .dark）依赖它。
        // 若只等 ThemeContext 的 useEffect / IndexedDB 主题读取，React 首帧会用浅色
        // 变量渲染一帧（白屏）再切回深色。这里在解析 HTML 时就定下来，首帧即正确。
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- 启动加载骨架：主 bundle 加载期间可见（React createRoot().render() 后自动替换）。
           仅 boot DOM 放在 #root 内（React 接管时替换它）；
           样式在 #root 外（见下方 <style>），React 接管后持续生效，无样式真空期。 -->
      <div id="moss-boot">
        <img class="moss-boot-logo" src="/MOSS.png" alt="MOSS" width="80" height="80" />
        <div class="moss-boot-wordmark">
          <span class="moss-boot-word">MOSS</span>
        </div>
        <div class="moss-boot-status" id="moss-boot-status">Loading…</div>
      </div>
    </div>
    <script>
      /* 启动骨架文案按语言显示：优先 localStorage 快照（moss-locale-fast，由 main.tsx
         的 initLocale 写入），其次旧值 moss-locale，最后跟随浏览器语言。
         须在骨架渲染前同步执行，避免中文界面出现英文 Loading。 */
      (function () {
        var lang = 'zh';
        try {
          var fast = localStorage.getItem('moss-locale-fast');
          var legacy = localStorage.getItem('moss-locale');
          var choice = fast === 'zh' || fast === 'en' ? fast : legacy;
          if (choice === 'zh' || choice === 'en') lang = choice;
          else
            lang = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
        } catch (e) {
          /* localStorage 不可用：按浏览器语言 */
          lang = (navigator.language || '').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
        }
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
        var el = document.getElementById('moss-boot-status');
        if (el) el.textContent = lang === 'zh' ? '正在加载' : 'Loading…';
      })();
    </script>
    <style>
      /* 全局重置与背景兜底：preflight 尚未加载的窗口期内消除 body 默认 margin 白边；
         html 背景始终为主题色，任何瞬间都不露白底。
         overflow:hidden：锁死文档级滚动条——100vh 在 Windows DPI 缩放下取整可溢出 1px，
         滚动条占位 ~17px 视口宽，出现/消失时视口宽度骤变导致居中内容横跳（"猛烈缩放"根因）。 */
      html,
      body {
        margin: 0;
        padding: 0;
      }
      html {
        overflow: hidden;
        /* hex 回退：Chrome 80/100 不支持 oklch，避免启动瞬间落到白色 */
        background: #0a0a0a;
        background: oklch(0.145 0 0);
      }
      html[data-boot-theme='light'] {
        background: #fff;
        background: oklch(1 0 0);
      }
      #moss-boot {
        /* dvh：精确视口高度（DPI 缩放取整不溢出）；不支持 dvh 时 min-height:100vh 兜底 */
        height: 100dvh;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        /* 四行式版式：logo → MOSS 字样 → 三点弹跳 → 文字 */
        gap: 24px;
        background: #0a0a0a;
        background: oklch(0.145 0 0);
        font-family: system-ui, sans-serif;
      }
      html[data-boot-theme='light'] #moss-boot {
        background: #fff;
        background: oklch(1 0 0);
      }
      .moss-boot-logo {
        width: 80px;
        height: 80px;
        /* 星语 loadingPulse：呼吸闪烁（opacity 1 → 0.6） */
        animation: moss-boot-pulse 2s ease-in-out infinite;
      }
      .moss-boot-wordmark {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .moss-boot-word {
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.3em;
        /* 抵消字距尾随空隙，保持视觉居中 */
        margin-right: -0.3em;
        /* 对齐 Tailwind preflight 行高：React 接管后 splash 同为 1.5，切换零高度差 */
        line-height: 1.5;
        color: #fafafa;
      }
      html[data-boot-theme='light'] .moss-boot-word {
        color: #18181b;
      }
      .moss-boot-status {
        font-size: 14px;
        /* 对齐 Tailwind preflight 行高（同 .moss-boot-word） */
        line-height: 1.5;
        color: #71717a;
        font-variant-numeric: tabular-nums;
      }
      @keyframes moss-boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .moss-boot-logo {
          animation: none;
        }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
